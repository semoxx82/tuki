<main>
<h1>🍽️ Tuki</h1>

<script>
const $=s=>document.querySelector(s);

function dlg(msg,o={}){return new Promise(res=>{const m=document.createElement('div');m.className='ov';m.innerHTML=`<div class="dlg"><p>${esc(msg)}</p>${o.input?'<input id="dlgi">':''}<div class="row" style="justify-content:flex-end;margin-top:10px">${o.cancel===false?'':'<button data-d="0">Cancelar</button>'}<button class="p" data-d="1">Aceptar</button></div></div>`;document.body.appendChild(m);const i=m.querySelector('input');if(i)i.focus();const done=v=>{m.remove();res(v)};m.onclick=e=>{const b=e.target.closest('button[data-d]');if(b)done(b.dataset.d==='1'?(i?i.value:true):(i?null:false))};if(i)i.onkeydown=e=>{if(e.key==='Enter')done(i.value)}})}
const note=m=>dlg(m,{cancel:false});
let errN=0;window.addEventListener('error',e=>{if(errN++<3)note('Error en la página: '+(e.message||'desconocido'))});window.addEventListener('unhandledrejection',e=>{if(errN++<3)note('Error: '+((e.reason&&(e.reason.message||e.reason.code))||e.reason))});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);
const DEF=['Ingrediente','Packaging','Extra'];
let cats={ins:[],rec:[],pla:[]};const filt={ins:'',rec:'',pla:''};
const itemsOf=t=>t==='ins'?Object.values(ins):Object.values(rec).filter(r=>(r.tipo==='base')===(t==='rec'));
function catList(t){return[...new Set([...(t==='ins'?DEF:[]),...cats[t],...itemsOf(t).map(x=>x.cat).filter(Boolean)])].sort((a,b)=>a.localeCompare(b))}
function catSel(t,id,cur){const L=catList(t);if(cur&&!L.includes(cur))L.push(cur);return`<select id="${id}" data-cat="${t}" data-prev="${esc(cur)}">${t==='ins'?'':'<option value="">Sin categoría</option>'}${L.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new">+ Nueva categoría…</option></select>`}
function chips(t){const L=catList(t);if(!L.length)return'';return'<div class="row" style="margin-bottom:10px;gap:6px">'+['',...L].map(c=>`<button data-a="filt" data-v="${esc(c)}" class="${filt[t]===c?'on':''}">${c?esc(c):'Todas'}</button>`).join('')+'</div>'}
const UN={kg:{r:'g',f:1000},l:{r:'ml',f:1000},u:{r:'u',f:1}};
let db=null,ins={},rec={},tab='ins',editIns=null,draft=null,ready=false;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const useCost=i=>(+i.precio||0)/(1-Math.min(+i.merma||0,95)/100);
function recTot(r,seen=[r.id]){let t=0;for(const l of r.ing||[]){if(l.t==='r'){const s=rec[l.i];if(s&&!seen.includes(l.i))t+=ruc(s,l.s,[...seen,l.i])*(+l.q||0)}else{const i=ins[l.i];if(i)t+=useCost(i)*(+l.q||0)/UN[i.un].f}}return t}
const spct=r=>Math.min((r.sub||[]).reduce((a,x)=>a+(+x.pct||0),0),100);
function ruc(r,sid,seen){const S=r.sub||[],T=recTot(r,seen);if(S.length){if(!sid)return 0;const x=S.find(y=>y.id===sid);if(!x)return 0;const sp=S.reduce((a,y)=>a+(+y.pct||0),0);return T*(sp>0?(+x.pct||0)/sp:1/S.length)/Math.max(+x.q||1,1)}return T/Math.max(+r.porciones||1,1)}
function recCost(r,seen=[r.id]){return ruc(r,null,seen)}
function mg(r){const c=recCost(r),p=+r.precio||0;return{c,m:p-c,pct:p?(p-c)/p*100:0}}
const cls=p=>p>=60?'ok':p>=40?'wa':'ko';
function save(col,id,d){
 if(!db)return note('Sin conexión a la base de datos');
 const M=()=>col==='insumos'?ins:col==='recetas'?rec:null,m0=M(),old=m0&&m0[id];
 if(m0)m0[id]=d;
 return db.collection(col).doc(id).set(d).catch(e=>{const m=M();if(m){if(old===undefined)delete m[id];else m[id]=old}render(true);note(e&&e.code==='invalid_argument'?'No se pudo guardar: tu usuario no tiene permiso de Editor, o los datos no son válidos.':'No se pudo guardar: '+((e&&e.message)||e))})}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
async function del(col,id){if(db&&await dlg('¿Borrar?'))db.collection(col).doc(id).delete()}

let ped={},vper='hoy',od=null,usr=null,meId=null,names={};
const PAGOS=['Efectivo','Transferencia','Débito','Crédito','Mercado Pago','Otro'];
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=f=>f.split('-').reverse().join('/');
function inPer(f){const n=new Date(),h=iso(n);if(vper==='hoy')return f===h;if(vper==='sem')return f>=iso(new Date(n.getTime()-6*864e5));if(vper==='mes')return f.slice(0,7)===h.slice(0,7);return true}
const nm=id=>names[id]||'Usuario';
async function resolveNames(){if(!usr)return;const ids=[...new Set([...Object.values(ped).flatMap(p=>[p.u,...(p.ev||[]).map(x=>x.u)]),...Object.values(com).map(c=>c.u)].filter(Boolean))].filter(i=>!(i in names));if(!ids.length)return;try{const r=await usr.profiles(ids);ids.forEach(i=>names[i]=(r[i]&&r[i].name)||'');render()}catch(e){}}
const calc=o=>{const sub=o.items.reduce((a,i)=>a+i.q*i.pr,0),c=o.items.reduce((a,i)=>a+i.q*i.c,0),v=+o.dv||0,d=o.dt==='$'?Math.min(v,sub):sub*Math.min(v,100)/100;return{sub,c,d,total:sub-d,g:sub-d-c}};
function totOd(){const e=$('#otot');if(!e||!od)return;const c=calc(od);e.innerHTML=`<div class="row"><div class="sp mut">Subtotal</div><div>${money(c.sub)}</div></div>${c.d?`<div class="row"><div class="sp mut">Descuento</div><div>−${money(c.d)}</div></div>`:''}<div class="row"><div class="sp big">Total</div><div class="big">${money(c.total)}</div></div>`}
function viewOd(){
 const P=Object.entries(rec).filter(([,r])=>r.tipo!=='base'&&r.activo!==false).sort((a,b)=>a[1].nombre.localeCompare(b[1].nombre));
 let h=`<div class="card"><div class="row"><div class="big sp">${od.n?'Pedido #'+od.n:'Nuevo pedido'}</div><button data-a="cancel">Cancelar</button></div>
 <div class="g2"><div><label>Fecha</label><input type="date" data-of="f" value="${od.f}"></div><div><label>Forma de pago</label><select data-of="pago">${[...new Set([...medNames(),od.pago].filter(Boolean))].map(p=>`<option ${od.pago===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div></div>
 <div class="mut" style="margin-top:6px">Cargado por ${esc(nm(od.u||meId))}</div></div>
 <div class="card"><label>Agregar plato</label><select data-of="add"><option value="">Elegir…</option>${P.map(([id,r])=>`<option value="${id}">${esc(r.nombre)} · ${money(r.precio)}</option>`).join('')}</select>`;
 od.items.forEach((it,k)=>{h+=`<div class="row" style="margin-top:8px"><div class="sp"><div>${esc(it.n)}</div><div class="mut">${money(it.pr)} c/u · ${money(it.q*it.pr)}</div></div><button data-a="oq" data-k="${k}" data-d="-1">−</button><b>${it.q}</b><button data-a="oq" data-k="${k}" data-d="1">+</button></div>`});
 if(!od.items.length)h+='<p class="mut">Todavía no hay platos en el pedido.</p>';
 h+=`</div><div class="card"><label>Descuento</label><div class="g2"><select data-of="dt"><option value="%" ${od.dt==='%'?'selected':''}>Porcentaje (%)</option><option value="$" ${od.dt==='$'?'selected':''}>Monto ($)</option></select><input type="number" inputmode="decimal" data-of="dv" placeholder="0" value="${od.dv??''}"></div></div>
 <div class="card" id="otot"></div><button class="p" data-a="saveOd" style="width:100%">${od.id?'Guardar cambios':'Confirmar pedido'}</button>${od.id?'':'<button data-a="saveOdK" style="width:100%;margin-top:8px">Confirmar y enviar a cocina</button>'}`;
 setTimeout(totOd);return h}
async function saveOd(k){
 if(!db)return note('Sin conexión a la base de datos');
 const items=od.items.filter(i=>i.q>0);if(!items.length)return note('Agregá al menos un plato');
 const c=calc({...od,items});let n=od.n,id=od.id;
 try{
  if(!id){n=Math.max(0,...Object.values(ped).map(p=>p.n||0))+1;const col=db.collection('pedidos');for(;;){const s=await col.doc(String(n)).get();if(!s.exists)break;n++}id=String(n)}
  await db.collection('pedidos').doc(id).set((()=>{const t0=od.t||Date.now(),ev=od.ev||[{e:'Creado',t:t0,u:meId||''}];if(!od.id&&k)ev.push({e:'En cocina',t:Date.now(),u:meId||''});return{n,f:od.f,t:t0,u:od.u||meId||'',pago:od.pago,items,dt:od.dt,dv:+od.dv||0,sub:c.sub,total:c.total,costo:c.c,est:od.est||(k?'En cocina':'Creado'),ev,pm:(()=>{const o=od.id&&ped[od.id],m=medByName(od.pago);if(o&&o.pago===od.pago&&o.pm)return o.pm;return m?{c:+m.com||0,d:+m.plazo||0,t:m.dt||'corridos'}:{c:0,d:0,t:'corridos'}})()}})());
  od=null;render(true)
 }catch(e){note('No se pudo guardar: '+e.message)}}
let imp=null,adm=true;
const nz=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const HM={nombre:'n',insumo:'n',producto:'n',descripcion:'n',articulo:'n',unidad:'un',um:'un',unidaddemedida:'un',medida:'un',precio:'p',costo:'p',preciounitario:'p',preciocompra:'p',merma:'m',desperdicio:'m',proveedor:'s',categoria:'c',rubro:'c'};
const UM={kg:'kg',kgs:'kg',kilo:'kg',kilos:'kg',kilogramo:'kg',l:'l',lt:'l',lts:'l',litro:'l',litros:'l',u:'u',un:'u',uni:'u',unidad:'u',unidades:'u'};
function num(v){if(typeof v==='number')return v;let s=String(v??'').replace(/[$%\s]/g,'');if(!s)return null;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const x=parseFloat(s);return isNaN(x)?null:x}
function parseRows(aoa){
 const hi=aoa.findIndex(r=>r.some(c=>HM[nz(c)]==='n'));if(hi<0)return{err:'No encontré la columna "Nombre" en la primera fila.'};
 const col={};aoa[hi].forEach((c,i)=>{const k=HM[nz(c)];if(k&&!(k in col))col[k]=i});
 if(!('p' in col))return{err:'No encontré la columna "Precio".'};
 const byName={};Object.entries(ins).forEach(([id,o])=>byName[nz(o.nombre)]=id);
 const seen=new Set(),rows=[];
 for(const r of aoa.slice(hi+1)){
  if(!r.some(c=>String(c??'').trim()))continue;
  const g=k=>k in col?r[col[k]]:'';const n=String(g('n')??'').trim(),key=nz(n),u=nz(g('un')),m=g('m');
  const row={n,un:UM[u]||'',p:num(g('p')),m:String(m??'').trim()===''?null:num(m),s:String(g('s')??'').trim(),c:String(g('c')??'').trim(),id:byName[key]||null,err:''};
  if(!n)row.err='Falta el nombre';
  else if(seen.has(key))row.err='Repetido en el archivo';
  else if(!(row.p>0))row.err='Precio inválido';
  else if(u&&!row.un)row.err='Unidad no reconocida';
  else if(!row.un&&!row.id)row.err='Falta la unidad';
  else if(row.m!==null&&!(row.m>=0&&row.m<95))row.err='Merma inválida';
  if(n)seen.add(key);rows.push(row)}
 return{rows}}
const same=r=>{const o=r.id&&ins[r.id];return!!o&&o.precio===r.p&&o.un===(r.un||o.un)&&(o.merma||0)===(r.m??(o.merma||0))&&(o.prov||'')===(r.s||o.prov||'')&&(o.cat||'Ingrediente')===(r.c||o.cat||'Ingrediente')};
async function exportIns(){
 if(typeof XLSX==='undefined')return note('No se pudo cargar el lector de Excel. Recargá la página.');
 let dl=DL;
 if(!dl)return note('La descarga no está disponible en este momento.');
 const rows=Object.values(ins).sort((a,b)=>(a.cat||'Ingrediente').localeCompare(b.cat||'Ingrediente')||a.nombre.localeCompare(b.nombre)).map(o=>({Nombre:o.nombre,Unidad:o.un,Precio:o.precio,'Merma (%)':o.merma||0,Proveedor:o.prov||'','Categoría':o.cat||'Ingrediente'}));
 if(!rows.length)return note('Todavía no hay insumos para exportar.');
 const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=[{wch:30},{wch:8},{wch:12},{wch:10},{wch:22},{wch:16}];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Insumos');
 const f='insumos-'+iso(new Date());
 try{await dl.save({filename:f+'.xlsx',data:XLSX.write(wb,{type:'array',bookType:'xlsx'})})}
 catch(e){if(e&&e.code==='declined')return;try{await dl.save({filename:f+'.csv',data:'\ufeff'+XLSX.utils.sheet_to_csv(ws,{FS:';'})})}catch(e2){note('No se pudo descargar: '+(e2.message||e2.code))}}}
async function readFile(f){
 if(typeof XLSX==='undefined')return note('No se pudo cargar el lector de Excel. Recargá la página e intentá de nuevo.');
 try{let wb;
  if(/\.(csv|txt)$/i.test(f.name)){const t=await f.text(),l=t.split('\n')[0],c=l.split(',').length,FS=l.split(';').length>c?';':(l.split('\t').length>c?'\t':',');wb=XLSX.read(t,{type:'string',FS})}
  else wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const r=parseRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}));
  imp.name=f.name;imp.err=r.err||'';imp.rows=r.rows||null
 }catch(e){imp.err='No se pudo leer el archivo: '+e.message;imp.rows=null}
 render(true)}
function viewImp(){
 let h=`<div class="card"><div class="row"><div class="big sp">Importar insumos</div><button data-a="cancel">Cerrar</button></div><p class="mut">Subí un Excel (.xlsx) o CSV con los títulos en la primera fila: <b>Nombre</b>, <b>Unidad</b> (kg, l o u) y <b>Precio</b>; opcionales: <b>Merma</b> (% que se pierde), <b>Proveedor</b> y <b>Categoría</b>. Si un nombre ya existe, se actualiza su precio.</p><input type="file" accept=".xlsx,.xls,.csv,.txt" data-imp="file"></div>`;
 if(imp.err)h+=`<div class="card ko">${esc(imp.err)}</div>`;
 if(imp.rows){
  const ok=imp.rows.filter(r=>!r.err&&(!r.id||(imp.upd&&!same(r)))),nw=ok.filter(r=>!r.id).length,er=imp.rows.filter(r=>r.err).length;
  h+=`<div class="card"><div>${esc(imp.name)}: <b>${nw}</b> nuevos · <b>${ok.length-nw}</b> a actualizar · <b class="${er?'ko':''}">${er}</b> con error</div><label style="display:flex;gap:8px;align-items:center;font-size:15px;color:inherit"><input type="checkbox" data-imp="upd" style="width:auto" ${imp.upd?'checked':''}>Actualizar insumos que ya existen</label>${ok.length?`<button class="p" data-a="impDo" style="width:100%;margin-top:8px">${imp.busy?'Importando…':'Importar '+ok.length+' insumos'}</button>`:''}</div>`;
  h+=imp.rows.slice(0,200).map(r=>{const o=r.id?ins[r.id]:null;return`<div class="card"><div class="row"><div class="sp"><div class="big">${esc(r.n||'(sin nombre)')}</div><div class="mut">${r.p!=null?money(r.p):'—'}/${r.un||(o?o.un:'?')}${r.m!=null?' · merma '+r.m+'%':''}${r.s?' · '+esc(r.s):''}${r.c?' · '+esc(r.c):''}${o?' · antes '+money(o.precio):''}</div></div><span class="pill ${r.err?'ko':r.id?(imp.upd&&!same(r)?'wa':'mut'):'ok'}">${r.err?esc(r.err):r.id?(same(r)?'Sin cambios':imp.upd?'Actualiza':'Se omite'):'Nuevo'}</span></div></div>`}).join('')+(imp.rows.length>200?`<p class="mut">Mostrando 200 de ${imp.rows.length}.</p>`:'')}
 return h}
async function doImport(){
 if(!db||imp.busy)return;
 const ok=imp.rows.filter(r=>!r.err&&(!r.id||(imp.upd&&!same(r))));if(!ok.length)return;
 imp.busy=true;render(true);
