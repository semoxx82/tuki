:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#2E1A47;--card:#3A2557;--tx:#CFC6DD;--mut:#A79CBB;--bd:#4D3770;--ac:#F5C443;--on-ac:#2E1A47;--ok:#4ade80;--wa:#fb923c;--ko:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 10px}button.wa{display:inline-flex;align-items:center;justify-content:center;padding:8px 10px;background:#18a74c;border-color:#18a74c;color:#fff;font-weight:600}button.wa:hover{background:#13913f;border-color:#13913f}button.wa svg{width:20px;height:20px;fill:currentColor;flex:none}.logo{height:40px;width:auto;display:block}
nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
nav button{flex:1 0 auto;padding:10px 10px;white-space:nowrap}
button,input,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:var(--on-ac);font-weight:600}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
button.x{color:var(--ko)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sp{flex:1}
.mut{color:var(--mut);font-size:14px}
.big{font-size:18px;font-weight:600}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.wa{color:var(--wa)}.ko{color:var(--ko)}
.ing{display:grid;grid-template-columns:1fr 90px 90px 52px 40px;gap:6px;margin-bottom:6px;align-items:center}
@media (max-width:520px){.ing{grid-template-columns:1fr 80px 52px 36px}.ing .c{display:none}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.dlg{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:380px}.dlg p{margin:0 0 10px}
.card.c{padding:0;margin-bottom:6px}.hd{display:flex;gap:10px;align-items:center;padding:12px;cursor:pointer}.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.chv{color:var(--mut)}.bd{padding:0 12px 12px;border-top:1px solid var(--bd)}
.sm{padding:6px 10px;font-size:14px}.ac{color:var(--ac)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle;background:var(--mut)}.dot.on{background:var(--ok)}.dot.off{background:var(--ko)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:60;font-size:14px;max-width:90%}
textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);font:inherit;color:inherit}
</style>

function dlg(msg,o={}){return new Promise(res=>{const m=document.createElement('div');m.className='ov';m.innerHTML=`<div class="dlg"><p>${esc(msg)}</p>${o.input?'<input id="dlgi">':''}<div class="row" style="justify-content:flex-end;margin-top:10px">${o.cancel===false?'':'<button data-d="0">Cancelar</button>'}<button class="p" data-d="1">Aceptar</button></div></div>`;document.body.appendChild(m);const i=m.querySelector('input');if(i)i.focus();const done=v=>{m.remove();res(v)};m.onclick=e=>{const b=e.target.closest('button[data-d]');if(b)done(b.dataset.d==='1'?(i?i.value:true):(i?null:false))};if(i)i.onkeydown=e=>{if(e.key==='Enter')done(i.value)}})}
const note=m=>dlg(m,{cancel:false});
let errN=0;window.addEventListener('error',e=>{if(errN++<3)note('Error en la página: '+(e.message||'desconocido'))});window.addEventListener('unhandledrejection',e=>{if(errN++<3)note('Error: '+((e.reason&&(e.reason.message||e.reason.code))||e.reason))});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);
const DEF=['Ingrediente','Packaging','Extra'];
let cats={ins:[],rec:[],pla:[]};const filt={ins:'',rec:'',pla:''};
const itemsOf=t=>t==='ins'?Object.values(ins):Object.values(rec).filter(r=>(r.tipo==='base')===(t==='rec'));
function catList(t){return[...new Set([...(t==='ins'?DEF:[]),...cats[t],...itemsOf(t).map(x=>x.cat).filter(Boolean)])].sort((a,b)=>a.localeCompare(b))}
function catSel(t,id,cur){const L=catList(t);if(cur&&!L.includes(cur))L.push(cur);return`<select id="${id}" data-cat="${t}" data-prev="${esc(cur)}">${t==='ins'?'':'<option value="">Sin categoría</option>'}${L.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new">+ Nueva categoría…</option></select>`}
function chips(t){const L=catList(t);if(!L.length)return'';return'<div class="row" style="margin-bottom:10px;gap:6px">'+['',...L].map(c=>`<button data-a="filt" data-v="${esc(c)}" class="${filt[t]===c?'on':''}">${c?esc(c):'Todas'}</button>`).join('')+'</div>'}
const UN={kg:{r:'g',f:1000},l:{r:'ml',f:1000},u:{r:'u',f:1}};
let db=null,ins={},rec={},tab='ins',editIns=null,draft=null,ready=false;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const useCost=i=>(+i.precio||0)/(1-Math.min(+i.merma||0,95)/100);
function recTot(r,seen=[r.id]){let t=0;for(const l of r.ing||[]){if(l.t==='r'){const s=rec[l.i];if(s&&!seen.includes(l.i))t+=ruc(s,l.s,[...seen,l.i])*(+l.q||0)}else{const i=ins[l.i];if(i)t+=useCost(i)*(+l.q||0)/UN[i.un].f}}return t}
const spct=r=>Math.min((r.sub||[]).reduce((a,x)=>a+(+x.pct||0),0),100);
function ruc(r,sid,seen){const S=r.sub||[],T=recTot(r,seen);if(S.length){if(!sid)return 0;const x=S.find(y=>y.id===sid);if(!x)return 0;const sp=S.reduce((a,y)=>a+(+y.pct||0),0);return T*(sp>0?(+x.pct||0)/sp:1/S.length)/Math.max(+x.q||1,1)}return T/Math.max(+r.porciones||1,1)}
function recCost(r,seen=[r.id]){return ruc(r,null,seen)}
function mg(r){const c=recCost(r),p=+r.precio||0;return{c,m:p-c,pct:p?(p-c)/p*100:0}}
const cls=p=>p>=60?'ok':p>=40?'wa':'ko';
function save(col,id,d){
 if(!db)return note('Sin conexión a la base de datos');

function scPanel(r,id,IL){const base=r.tipo==='base',Y=(r.sub||[]).length?r.sub.map(x=>({n:x.n,u:x.un||'g',q:+x.q||0})):[{n:base?'Rinde':'Porciones',u:base?(r.un||'g'):'porciones',q:+r.porciones||1}];
 const row=(l,k,t)=>`<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><div class="sp" style="min-width:0">${esc(l.n)}</div>${l.cn?'<b style="width:90px;text-align:right">c/n</b>':`<span class="mut" style="font-size:12px">orig. ${scR(l.q)}</span><input type="number" inputmode="decimal" min="0" data-sc="${t}${k}" data-base="${l.q}" value="${scR(l.q)}" style="width:90px"><span class="mut" style="min-width:46px">${esc(l.u)}</span>`}</div>`;

const evSave=()=>{try{localStorage.setItem('tuki_evento',JSON.stringify(evs))}catch(e){}};
function evItem(k){const[id,sid]=String(k).split('|'),r=rec[id];if(!r)return null;let label=r.nombre,un=r.tipo==='base'?(r.un||'g'):'porciones';if(sid){const x=(r.sub||[]).find(y=>y.id===sid);if(!x)return null;label+=' · '+x.n;un=x.un||'g'}return{id,sid:sid||null,r,label,un,plato:r.tipo!=='base'}}
function evWalk(r,units,sid,seen,acc){const S=r.sub||[];let b;if(S.length){const x=S.find(y=>y.id===sid);b=x?units/Math.max(+x.q||1,1):0}else b=units/Math.max(+r.porciones||1,1);for(const l of r.ing||[]){const q=b*(+l.q||0);if(l.t==='r'){const s2=rec[l.i];if(s2&&!seen.includes(l.i))evWalk(s2,q,l.s||null,[...seen,l.i],acc)}else if(ins[l.i])acc[l.i]=(acc[l.i]||0)+q}}
function evFmt(i,q){if(i.un==='u')return Math.ceil(q-1e-9)+' u';const f=UN[i.un].f;return q>=f?fq(q/f,i.un):fq(q,UN[i.un].r)}
function evResult(){const acc={};for(const it of evs){const x=evItem(it.k),u=+it.q||0;if(x&&u>0)evWalk(x.r,u,x.sid,[x.id],acc)}
 const rows=Object.entries(acc).map(([id,net])=>{const i=ins[id],g=net/(1-Math.min(+i.merma||0,95)/100);return{n:i.nombre,cat:i.cat||'Sin categoría',net,g,merma:+i.merma||0,txt:net>0?evFmt(i,g):'c/n',ntx:evFmt(i,net),cost:(+i.precio||0)*g/UN[i.un].f}}).sort((a,b)=>a.cat.localeCompare(b.cat)||a.n.localeCompare(b.n));
 if(!rows.length)return{html:'<p class="mut">Cargá una cantidad mayor a 0 para ver los insumos necesarios.</p>',rows,total:0};
 let h='',c=null,total=0;for(const r of rows){if(r.cat!==c){c=r.cat;h+=`<div class="mut" style="margin:12px 0 2px;font-size:12px;text-transform:uppercase">${esc(c)}</div>`}total+=r.cost;h+=`<div class="row" style="padding:5px 0;gap:8px"><div class="sp"><div>${esc(r.n)}</div>${r.merma>0&&r.net>0?`<div class="mut" style="font-size:12px">neto ${r.ntx} · merma ${r.merma}%</div>`:''}</div><b>${r.txt}</b><span class="mut" style="min-width:76px;text-align:right">${money(r.cost)}</span></div>`}

function evText(w){const R=evResult().rows;if(!R.length)return'';const b=w?'*':'',hd=evs.map(it=>{const x=evItem(it.k);return x&&+it.q>0?'• '+x.label+': '+it.q+' '+x.un:''}).filter(Boolean).join('\n');return b+'Evento'+b+'\n'+hd+'\n\n'+b+'Insumos necesarios:'+b+'\n'+R.map(r=>'- '+r.n+': '+r.txt).join('\n')}

 const used=new Set(evs.map(x=>x.k)),opt=(k,t)=>used.has(k)?'':`<option value="${esc(k)}">${esc(t)}</option>`,P=[],R=[];

 const og=(t,L)=>{const o=L.sort((a,b)=>a[1].localeCompare(b[1])).map(([k,n])=>opt(k,n)).join('');return o?`<optgroup label="${t}">${o}</optgroup>`:''};

 return h}
